name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22.x", "1.23.x"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: gofmt -d
        run: |
          diff=$(gofmt -d .)
          if [ -n "$diff" ]; then
            echo "::error::gofmt differences detected"
            echo "$diff"
            exit 1
          fi

  gate:
    name: gate
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the matrix to have succeeded
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "matrix job did not succeed: ${{ needs.build.result }}"
            exit 1
          fi
